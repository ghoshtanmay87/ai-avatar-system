[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------------------
; Postgres and Redis are started by container-init.sh BEFORE supervisord
; takes over the terminal (so first-boot initdb / model download can run
; synchronously and block startup of everything else). Supervisord then
; supervises them going forward so they restart automatically if they die.
; ---------------------------------------------------------------------------

[program:postgres]
command=/usr/lib/postgresql/14/bin/postgres -D /workspace/postgres_data -c listen_addresses=127.0.0.1 -c port=5432
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err.log

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir /workspace/redis_data --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log

[program:backend]
command=/app/backend/entrypoint.sh
directory=/app/backend
autostart=true
autorestart=true
priority=20
startsecs=10
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.err.log

[program:celery-worker]
command=celery -A app.celery_app worker --loglevel=info --concurrency=2
directory=/app/backend
autostart=true
autorestart=true
priority=20
startsecs=10
stdout_logfile=/var/log/supervisor/celery.log
stderr_logfile=/var/log/supervisor/celery.err.log

[program:frontend]
command=npm start
directory=/app/frontend
autostart=true
autorestart=true
priority=30
startsecs=10
environment=PORT=3000
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend.err.log

[program:nginx]
command=nginx -c /app/deploy/runpod/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log
